<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IMPERO DI TIGROTTA 🐯</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #050505; color: #eee; font-family: sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #sidebar { width: 220px; background: #111; border-right: 2px solid #ff00ff; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; background: #000; }
        #right-panel { width: 280px; background: #111; border-left: 2px solid #00f2ff; padding: 10px; overflow-y: auto; }
        .header { padding: 12px; background: #1a1a1a; text-align: center; font-weight: bold; color: #ff00ff; border-bottom: 1px solid #333; text-transform: uppercase; }
        .stanza-link { padding: 15px; color: #ccc; cursor: pointer; transition: 0.3s; border-bottom: 1px solid #222; }
        .stanza-link:hover { background: #222; color: #ff00ff; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #080808; }
        .input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        button { padding: 10px 15px; background: #ff00ff; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cam-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #1a1a1a; margin-bottom: 10px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏰 Stanze</div>
        <div class="stanza-link" onclick="cambiaStanza('👑 PRIVATA BOSS')">👑 Privata Boss</div>
        <div class="stanza-link" onclick="cambiaStanza('💬 CHIACCHIERE')">💬 Chiacchiere</div>
        <div class="stanza-link" onclick="cambiaStanza('🎵 MUSICA LIVE')">🎵 Musica Live</div>
        
        <div class="header" style="margin-top:auto;">👥 Online</div>
        <div style="padding:15px; color: gold; font-weight: bold;">⭐ TIGROTTA</div>
    </div>

    <div id="main">
        <div class="header" id="chat-title">L'ARENA DI TIGROTTA</div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Scrivi un messaggio...">
            <button onclick="invia()">INVIA</button>
        </div>
    </div>

    <div id="right-panel">
        <div class="header" style="color: #00f2ff;">🎥 La Tua Cam</div>
        <div class="cam-container">
            <video id="webcam" autoplay playsinline></video>
            <button onclick="toggleWebcam()" style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.6); font-size:10px; padding:5px;">ON/OFF</button>
        </div>
        
        <div class="header" style="color: #00f2ff; margin-top: 15px;">🎧 YouTube</div>
        <div id="playerContainer" style="width:100%; height:150px; background:#000; border:1px solid #00f2ff; margin-bottom:5px;"></div>
        <input type="text" id="ytUrl" placeholder="Link Video..." style="width:100%; margin-bottom:5px;">
        <button onclick="caricaVideo()" style="width:100%; background:#00f2ff; color:#000;">CARICA</button>
    </div>

    <script>
        // Funzione per cambiare stanza
        function cambiaStanza(nome) {
            document.getElementById('chat-title').innerText = nome;
            document.getElementById('chat-box').innerHTML += `<p style="color:#555; font-style:italic;">Sei entrata in: ${nome}</p>`;
        }

        // Funzione Chat
        function invia() {
            const input = document.getElementById('msgInput');
            const chat = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                chat.innerHTML += `<p><strong style="color:#ff00ff">TIGROTTA:</strong> ${input.value}</p>`;
                input.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        // Funzione YouTube
        function caricaVideo() {
            const url = document.getElementById('ytUrl').value;
            let videoId = url.includes("v=") ? url.split("v=")[1].split("&")[0] : url.split("youtu.be/")[1];
            if (videoId) {
                document.getElementById('playerContainer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
            }
        }

        // Funzione Webcam (Migliorata)
        let stream = null;
        async function toggleWebcam() {
            const video = document.getElementById('webcam');
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                video.srcObject = null;
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) { alert("Attiva i permessi cam nel browser!"); }
            }
        }
    </script>
</body>
</html>
