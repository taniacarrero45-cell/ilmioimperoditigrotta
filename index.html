<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IMPERO DI TIGROTTA 🐯</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #050505; color: #eee; font-family: sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #sidebar { width: 220px; background: #111; border-right: 2px solid #ff00ff; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; background: #000; }
        #right-panel { width: 280px; background: #111; border-left: 2px solid #00f2ff; padding: 10px; overflow-y: auto; }
        .header { padding: 12px; background: #1a1a1a; text-align: center; font-weight: bold; color: #ff00ff; border-bottom: 1px solid #333; text-transform: uppercase; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #080808; }
        .input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 13px; }
        button { padding: 10px 15px; background: #ff00ff; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* WEBCAM */
        .cam-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #1a1a1a; margin-bottom: 10px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-cam { position: absolute; top: 5px; right: 5px; background: rgba(255, 0, 255, 0.7); border: none; color: white; padding: 5px 10px; border-radius: 3px; cursor: pointer; }

        /* YOUTUBE BOX */
        .yt-box { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #00f2ff; background: #000; min-height: 150px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏰 Stanze</div>
        <div style="padding:15px; color: #ff00ff;">👑 Privata Boss</div>
        <div style="padding:15px; color: #ccc;">💬 Chiacchiere</div>
        <div class="header" style="margin-top:auto;">👥 Online</div>
        <div style="padding:15px; color: gold; font-weight: bold;">⭐ TIGROTTA</div>
    </div>

    <div id="main">
        <div class="header" style="color: #fff;">L'ARENA DI TIGROTTA</div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Invia un messaggio...">
            <button onclick="invia()">INVIA</button>
        </div>
    </div>

    <div id="right-panel">
        <div class="header" style="color: #00f2ff;">🎥 La Tua Cam</div>
        <div class="cam-container">
            <button class="btn-cam" onclick="toggleWebcam()">ON/OFF</button>
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <div class="header" style="color: #00f2ff; margin-top: 15px;">🎧 Musica YouTube</div>
        <div id="playerContainer" class="yt-box">
            <div style="padding: 40px 10px; text-align: center; color: #444;">Incolla un link sotto...</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <input type="text" id="ytUrl" placeholder="Incolla link YouTube qui...">
            <button style="background: #00f2ff; color: #000;" onclick="caricaVideo()">CARICA VIDEO</button>
        </div>
    </div>

    <script>
        // Funzione Chat
        function invia() {
            const input = document.getElementById('msgInput');
            const chat = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                chat.innerHTML += `<p><strong style="color:#ff00ff">TIGROTTA:</strong> ${input.value}</p>`;
                input.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        // Funzione per caricare YouTube al volo
        function caricaVideo() {
            const url = document.getElementById('ytUrl').value;
            let videoId = "";
            
            if (url.includes("v=")) {
                videoId = url.split("v=")[1].split("&")[0];
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            }

            if (videoId !== "") {
                document.getElementById('playerContainer').innerHTML = 
                    `<iframe width="100%" height="150" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else {
                alert("Link non valido! Copia un link come: https://www.youtube.com/watch?v=...");
            }
        }

        // Funzione Webcam
        let stream = null;
        async function toggleWebcam() {
            const video = document.getElementById('webcam');
            if (stream && stream.active) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (err) { alert("Attiva la cam nel browser!"); }
            }
        }
    </script>

</body>
</html>
