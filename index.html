<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>👑 IMPERO DI TIGROTTA 👑</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: linear-gradient(45deg, #050505, #1a001a, #000b1a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; display: flex; overflow: hidden; 
        }
        @keyframes gradient { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        #sidebar, #right-panel { 
            width: 250px; background: rgba(17, 17, 17, 0.8); 
            backdrop-filter: blur(10px); border-right: 1px solid #ff00ff55; 
            display: flex; flex-direction: column; 
        }
        #right-panel { border-right: none; border-left: 1px solid #00f2ff55; padding: 10px; }
        #main { flex: 1; display: flex; flex-direction: column; background: transparent; }

        .header { 
            padding: 15px; background: rgba(30, 30, 30, 0.5); 
            text-align: center; font-weight: bold; color: #ff00ff; 
            text-shadow: 0 0 10px #ff00ff; border-bottom: 1px solid #333; 
            text-transform: uppercase; letter-spacing: 2px;
        }

        .stanza-link { padding: 15px; color: #ccc; cursor: pointer; transition: 0.3s; border-bottom: 1px solid #222; }
        .stanza-link:hover { background: rgba(255, 0, 255, 0.2); color: white; padding-left: 20px; }

        /* BOX CHAT REALE */
        #chat-container { flex: 1; width: 100%; height: 100%; border: none; background: transparent; }

        .cam-container { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; margin-bottom: 10px; border: 2px solid #00f2ff; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-cam-overlay { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #00f2ff; border: 1px solid #00f2ff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }

        .user-online { color: #00ff00; font-size: 14px; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏰 STANZE</div>
        <div class="stanza-link" onclick="document.getElementById('chat-title').innerText='👑 PRIVATA BOSS'">👑 Privata Boss</div>
        <div class="stanza-link" onclick="document.getElementById('chat-title').innerText='💬 CHIACCHIERE'">💬 Chiacchiere</div>
        <div class="stanza-link" onclick="document.getElementById('chat-title').innerText='🔥 ARENA LIVE'">🔥 Arena Live</div>
        
        <div class="header" style="margin-top:auto;">👥 ONLINE</div>
        <div class="user-online"><div class="dot"></div> ⭐ TIGROTTA (Admin)</div>
    </div>

    <div id="main">
        <div class="header" id="chat-title">L'ARENA DI TIGROTTA</div>
        <iframe src="https://www5.cbox.ws/box/?boxid=960938&boxtag=AP3Bo3" width="100%" height="100%" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto" id="chat-container"></iframe>
    </div>

    <div id="right-panel">
        <div class="header" style="color: #00f2ff;">🎥 LIVE CAM</div>
        <div class="cam-container">
            <video id="webcam" autoplay playsinline></video>
            <button class="btn-cam-overlay" onclick="toggleWebcam()">ACCENDI/SPEGNI</button>
        </div>
        
        <div class="header" style="color: #00f2ff; margin-top: 15px;">🎧 MUSICA</div>
        <div id="playerContainer" style="width:100%; height:140px; background:#000; border:1px solid #00f2ff; border-radius:8px; margin-bottom:10px;"></div>
        <input type="text" id="ytUrl" placeholder="Incolla Link YouTube..." style="width:100%; margin-bottom:5px; background:#222; color:white; border:1px solid #444; padding:8px; border-radius:4px;">
        <button onclick="caricaVideo()" style="width:100%; background:#00f2ff; color:#000; padding:10px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">CARICA VIDEO</button>
    </div>

    <script>
        function caricaVideo() {
            const url = document.getElementById('ytUrl').value;
            let id = "";
            if(url.includes("v=")) id = url.split("v=")[1].split("&")[0];
            else if(url.includes("youtu.be/")) id = url.split("youtu.be/")[1];
            
            if (id) {
                document.getElementById('playerContainer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
            }
        }

        let stream = null;
        async function toggleWebcam() {
            const video = document.getElementById('webcam');
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null; video.srcObject = null;
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) { alert("Attiva i permessi cam!"); }
            }
        }
    </script>
</body>
</html>
