<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IMPERO DI TIGROTTA 🐯</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #050505; color: #eee; font-family: sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #sidebar { width: 220px; background: #111; border-right: 2px solid #ff00ff; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; background: #000; }
        #right-panel { width: 280px; background: #111; border-left: 2px solid #00f2ff; padding: 10px; overflow-y: auto; }
        .header { padding: 12px; background: #1a1a1a; text-align: center; font-weight: bold; color: #ff00ff; border-bottom: 1px solid #333; text-transform: uppercase; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #080808; }
        .input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        button { padding: 10px 20px; background: #ff00ff; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cam-box { width: 100%; aspect-ratio: 4/3; background: #1a1a1a; margin-bottom: 10px; border: 1px solid #333; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #444; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">🏰 Stanze</div>
        <div style="padding:15px; color: #ff00ff;">👑 Privata Boss</div>
        <div style="padding:15px; color: #ccc;">💬 Chiacchiere</div>
        <div class="header" style="margin-top:auto;">👥 Online</div>
        <div style="padding:15px; color: gold; font-weight: bold;">⭐ TIGROTTA</div>
    </div>

    <div id="main">
        <div class="header" style="color: #fff;">L'ARENA DI TIGROTTA</div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Invia un messaggio...">
            <button onclick="invia()">INVIA</button>
        </div>
    </div>

    <div id="right-panel">
        <div class="header" style="color: #00f2ff;">🎥 La Tua Cam</div>
        <div class="cam-box">
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <div class="header" style="color: #00f2ff; margin-top: 15px;">🎧 Musica</div>
        <iframe width="100%" height="160" src="https://www.youtube.com/embed/S_RzS9WZc-8" frameborder="0" allowfullscreen style="border-radius: 8px; border: 1px solid #00f2ff;"></iframe>
    </div>

    <script>
        // Funzione Chat
        function invia() {
            const input = document.getElementById('msgInput');
            const chat = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                chat.innerHTML += `<p><strong style="color:#ff00ff">TIGROTTA:</strong> ${input.value}</p>`;
                input.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        // Accendi Webcam
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.log("Webcam non trovata o negata");
            }
        }
        startWebcam();
    </script>

</body>
</html>
